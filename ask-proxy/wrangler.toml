name = "conference-briefing-ask"
main = "src/index.js"
compatibility_date = "2025-01-01"

[vars]
# Comma-separated list of origins allowed to call this proxy. Replace with the real Pages origin.
ALLOWED_ORIGIN = "https://fredthelifeguard.github.io"
MODEL = "claude-sonnet-5-5"
RATE_LIMIT = "10"

# Optional per-IP rate limiting. Create with: wrangler kv namespace create RATE_KV
# then paste the id here. Delete this block to run without rate limiting.
[[kv_namespaces]]
binding = "RATE_KV"
id = "f5b3d63ddf624da48a8c839f021ddc7c"

# Secret (never commit): wrangler secret put ANTHROPIC_API_KEY
