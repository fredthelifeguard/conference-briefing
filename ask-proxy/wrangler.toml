name = "conference-briefing-ask"
main = "src/index.js"
compatibility_date = "2025-01-01"

[vars]
# Comma-separated list of origins allowed to call this proxy. Replace with the real Pages origin.
ALLOWED_ORIGIN = "https://fredthelifeguard.github.io"
MODEL = "claude-sonnet-5-5"
RATE_LIMIT = "10"

# Per-IP rate limiting via the Workers Rate Limiting binding: 10 requests per
# 60-second window per IP (period must be 10 or 60). namespace_id is any
# integer unique within this Worker.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

# Legacy KV counter, kept only as a fallback if RATE_LIMITER is removed.
# KV read caching makes it inaccurate; the ratelimits binding above is used instead.
[[kv_namespaces]]
binding = "RATE_KV"
id = "f5b3d63ddf624da48a8c839f021ddc7c"

# Secret (never commit): wrangler secret put ANTHROPIC_API_KEY
